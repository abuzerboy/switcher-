
name: Build Switcher +

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Switcher +
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check archive
        run: |
          test -f "NEXUS-fixed.zip" || {
            echo "NEXUS-fixed.zip not found in repository root!"
            exit 1
          }

      - name: Extract project
        run: |
          unzip -q NEXUS-fixed.zip -d source
          test -f source/NEXUS/settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p source/NEXUS \
            :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp source/NEXUS/app/build/outputs/apk/debug/app-debug.apk \
             "output/switcher +.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: switcher +
          path: "output/switcher +.apk"
          if-no-files-found: error
          retention-days: 14
