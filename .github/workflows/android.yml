
name: Build Switcher +

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install RAR extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y unar

      - name: Extract NEXUS.rar
        run: |
          mkdir -p source
          unar -o source NEXUS.rar

      - name: Find Android project
        id: project
        run: |
          SETTINGS=$(find source -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "Android project settings.gradle not found!"
            find source -maxdepth 4 -type f
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: |
          gradle --no-daemon -p "${{ steps.project.outputs.dir }}" :app:assembleDebug

      - name: Prepare APK
        run: |
          APK="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p output
          cp "$APK" "output/switcher +.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: switcher +
          path: "output/switcher +.apk"
          if-no-files-found: error
