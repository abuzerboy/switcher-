
name: Build Switcher +

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Switcher +
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check archive
        run: |
          test -f "NEXUS-fixed.zip" || {
            echo "NEXUS-fixed.zip not found in repository root!"
            exit 1
          }

      - name: Extract project
        run: |
          unzip -q NEXUS-fixed.zip -d source
          SETTINGS=$(find source -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found!"
            find source -maxdepth 4 -type f
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            :app:assembleDebug

      - name: Prepare APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "APK was not generated!"
            find "$PROJECT_DIR/app/build/outputs" -type f || true
            exit 1
          fi
          mkdir -p output
          cp "$APK" "output/switcher +.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: switcher +
          path: "output/switcher +.apk"
          if-no-files-found: error
          retention-days: 14
